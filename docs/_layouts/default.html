<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
    <!-- MathJax for rendering radar physics and hydrodynamic equations -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
      html,
      body,
      .outer {
        max-width: 100%;
        overflow-x: hidden;
      }
      .inner {
        box-sizing: border-box;
        max-width: 1040px;
        width: 100%;
        padding-left: 24px;
        padding-right: 24px;
      }
      #header_wrap .inner {
        padding-right: 190px;
      }
      #project_title,
      #project_tagline {
        overflow-wrap: anywhere;
      }
      #project_title {
        line-height: 1.15;
      }
      #project_tagline {
        line-height: 1.3;
      }
      #main_content_wrap {
        min-height: calc(100vh - 220px);
      }
      .site-nav {
        background: #1e252b;
        border-bottom: 1px solid #303b44;
      }
      .site-nav .inner {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        align-items: center;
        padding-top: 12px;
        padding-bottom: 12px;
      }
      .site-nav a {
        color: #79d4fd;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.88em;
      }
      .site-nav a:hover {
        color: #39ff14;
        text-decoration: underline;
      }
      table {
        display: table;
        width: 100%;
      }
      @media screen and (max-width: 720px) {
        .inner {
          min-width: 0;
        }
        #project_title {
          font-size: clamp(2rem, 9vw, 2.6rem);
        }
        #header_wrap .inner {
          padding: 30px 20px 24px;
        }
        #forkme_banner {
          position: static;
          display: inline-block;
          margin-top: 12px;
          border-radius: 4px;
        }
        .site-nav .inner {
          padding-left: 20px;
          padding-right: 20px;
        }
        #main_content {
          padding-top: 28px;
        }
        #main_content h1 {
          font-size: clamp(1.75rem, 8vw, 2.25rem);
        }
        #main_content h2 {
          font-size: clamp(1.5rem, 7vw, 2rem);
        }
        #main_content h1,
        #main_content h2,
        #main_content h3,
        #main_content p,
        #main_content li {
          overflow-wrap: anywhere;
        }
        table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <header id="header_wrap" class="outer">
      <div class="inner">
        <a href="{{ '/' | relative_url }}">
          <h1 id="project_title">{{ site.title }}</h1>
        </a>
        <h2 id="project_tagline">{{ site.description }}</h2>
        <a id="forkme_banner" href="https://github.com/{{ site.repository }}">View on GitHub</a>
      </div>
    </header>

    <nav class="site-nav" aria-label="Documentation">
      <div class="inner">
        {% for item in site.nav_links %}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </div>
    </nav>

    <main id="main_content_wrap" class="outer">
      <section id="main_content" class="inner">
        {{ content }}
      </section>
    </main>
  </body>
</html>
