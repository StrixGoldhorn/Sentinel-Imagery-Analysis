{% extends 'base.html' %}

{% block title %}SAR Maritime Scanner{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="/static/css/styles.css" />
{% endblock %}

{% block content %}
<div class="sidebar">
    <div class="accordion-item">
        <button class="accordion-header active" onclick="toggleAccordion(this)">Area Scan</button>
        <div id="scan-page" class="accordion-content active">
            <h3>SAR Area Scan</h3>
            <p id="status">Draw a rectangle to begin.</p>
            <button id="scanBtn" disabled>Scan Selected Area</button>
            <button id="clearScansBtn" style="background: #dc3545; margin-top: 5px;">Clear All Scans</button>
        </div>
    </div>

    <div class="accordion-item">
        <button class="accordion-header" onclick="toggleAccordion(this)">Layers</button>
        <div id="layers-page" class="accordion-content">
            <h3>Manage Layers</h3>
            <div id="layersList"></div>
        </div>
    </div>

    <div class="accordion-item">
        <button class="accordion-header" onclick="toggleAccordion(this)">Areas of Interest</button>
        <div id="aoi-page" class="accordion-content">
            <h3>Areas of Interest (AOIs)</h3>
            <p id="aoiStatus" style="font-size: 0.9em; margin-bottom: 10px;">Draw a rectangle to begin.</p>
            <form id="addAoiForm" style="margin-bottom: 15px;">
                <div style="margin-bottom: 10px;">
                    <label for="aoiName" style="font-size: 0.85em; color: #666;">Name your drawn area</label>
                    <input type="text" id="aoiName" placeholder="e.g. Port of Singapore" style="width: 100%; padding: 5px; box-sizing: border-box;" required>
                </div>
                <button type="button" id="saveAoiBtn" class="btn" style="width: 100%;" disabled>Save Drawn Area as AOI</button>
            </form>
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
            <h4 style="font-size: 0.9em; margin-bottom: 10px;">Tracked Locations</h4>
            <div id="aoiList" style="max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                <!-- AOIs will be dynamically inserted here via JS -->
            </div>
        </div>
    </div>
</div>

<div class="search-group">
    <div style="display: flex; gap: 5px; width: 100%;">
        <input type="text" id="locationSearch" placeholder="Search location..." style="flex: 1;" onkeydown="if(event.key==='Enter') searchLocation()">
        <button onclick="searchLocation()" class="btn">Go</button>
    </div>
    <div id="searchResults" class="search-results"></div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
    // Load saved map view or defaults
    const savedView = JSON.parse(localStorage.getItem('map_view_state')) || {
        lat: 1.290270,
        lng: 103.851959,
        zoom: 10
    };
    const map = L.map('map').setView([savedView.lat, savedView.lng], savedView.zoom);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Add dynamic scale bar (metric units)
    L.control.scale({ imperial: false }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
        draw: {
            polygon: false, marker: false, circle: false, polyline: false, circlemarker: false,
            rectangle: { shapeOptions: { color: '#007bff' } }
        },
        edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);
    let drawControlVisible = true;

    // Search & Suggestions Logic
    let abortController = null;
    const searchInput = document.getElementById('locationSearch');
    const resultsBox = document.getElementById('searchResults');

    function debounce(func, timeout = 400) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }

    // Debounced function to sync metadata to the server
    const updateServerMetadata = debounce(async (folderName, customName) => {
        try {
            await fetch(`/api/update_metadata/${folderName}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ custom_name: customName })
            });
        } catch (e) { console.error("Failed to update metadata on server", e); }
    }, 1000); // 1 second delay

    const fetchSuggestions = debounce(async (query) => {
        if (query.length < 3) {
            resultsBox.style.display = 'none';
            return;
        }

        if (abortController) abortController.abort();
        abortController = new AbortController();

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&accept-language=en`, { signal: abortController.signal });
            const data = await response.json();
            
            resultsBox.innerHTML = '';
            if (data.length > 0) {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.innerHTML = item.display_name;
                    div.onclick = () => {
                        map.setView([parseFloat(item.lat), parseFloat(item.lon)], 13);
                        searchInput.value = item.display_name;
                        resultsBox.style.display = 'none';
                    };
                    resultsBox.appendChild(div);
                });
                resultsBox.style.display = 'block';
            } else {
                resultsBox.style.display = 'none';
            }
        } catch (error) {
            if (error.name !== 'AbortError') console.error('Suggestion error:', error);
        }
    });

    searchInput.addEventListener('input', (e) => fetchSuggestions(e.target.value));
    
    // Close suggestions when clicking elsewhere
    document.addEventListener('click', (e) => {
        if (!document.querySelector('.search-group').contains(e.target)) {
            resultsBox.style.display = 'none';
        }
    });

    // Search Location logic
    async function searchLocation() {
        const query = document.getElementById('locationSearch').value;
        if (!query) return;
        
        // Hide results and clear debounce timer
        resultsBox.style.display = 'none';
        
        // Re-use the top suggestion or execute full search
        fetchSuggestions(query);
    }

    // Sidebar Accordion Logic
    function toggleAccordion(header) {
        const content = header.nextElementSibling;
        const isActive = header.classList.contains('active');

        // Close all other items
        document.querySelectorAll('.accordion-header').forEach(h => { if(h !== header) h.classList.remove('active') });
        document.querySelectorAll('.accordion-content').forEach(c => { if(c !== content) c.classList.remove('active') });

        // Toggle current item
        header.classList.toggle('active');
        content.classList.toggle('active');

        // Manage draw control based on whether the Area Scan panel is active
        const isScanActive = document.getElementById('scan-page').classList.contains('active');
        const isAoiActive = document.getElementById('aoi-page').classList.contains('active');
        if ((isScanActive || isAoiActive) && !drawControlVisible) {
            map.addControl(drawControl);
            drawControlVisible = true;
        } else if (!isScanActive && !isAoiActive && drawControlVisible) {
            map.removeControl(drawControl);
            drawControlVisible = false;
        }
    }

    let currentBbox = null;
    let activeLayers = []; // Track layers to allow "Clear All" functionality

    // Save map view whenever it changes
    map.on('moveend', () => {
        localStorage.setItem('map_view_state', JSON.stringify({
            lat: map.getCenter().lat,
            lng: map.getCenter().lng,
            zoom: map.getZoom()
        }));
    });

    const scanBtn = document.getElementById('scanBtn');
    const statusText = document.getElementById('status');

    // Function to calculate dimensions in km
    function getDimensions(layer) {
        const bounds = layer.getBounds();
        const nw = bounds.getNorthWest();
        const ne = bounds.getNorthEast();
        const sw = bounds.getSouthWest();
        
        // Calculate distance in meters and convert to km
        const width = map.distance(nw, ne) / 1000;
        const height = map.distance(nw, sw) / 1000;
        
        return { width, height };
    }

    // Enhanced dynamic dimension updates during mouse movement
    map.on(L.Draw.Event.DRAWSTART, function(e) {
        if (e.drawLayerType === 'rectangle') {
            const moveHandler = function() {
                // Access the internal rectangle handler to get the live shape
                const drawHandler = drawControl._toolbars.draw._modes.rectangle.handler;
                if (drawHandler && drawHandler._shape) {
                    const dim = getDimensions(drawHandler._shape);
                    const sizeText = `${dim.width.toFixed(2)} km x ${dim.height.toFixed(2)} km`;
                    statusText.innerText = `Selecting: ${sizeText}`;
                    document.getElementById('aoiStatus').innerText = `Selecting: ${sizeText}`;
                }
            };
            
            map.on('mousemove', moveHandler);
            
            // Clean up listener when drawing is finished or cancelled
            map.once(L.Draw.Event.DRAWSTOP, () => map.off('mousemove', moveHandler));
        }
    });

    map.on(L.Draw.Event.CREATED, function (event) {
        drawnItems.clearLayers();
        const layer = event.layer;
        drawnItems.addLayer(layer);
        
        // Enable handles for immediate adjustment (corner/edge dragging)
        if (layer.editing) layer.editing.enable();

        const updateSelectionData = () => {
            const bounds = layer.getBounds();
            const dim = getDimensions(layer);

            // Format for backend: [min_lon, min_lat, max_lon, max_lat]
            currentBbox = [
                bounds.getWest(), bounds.getSouth(), 
                bounds.getEast(), bounds.getNorth()
            ];
            scanBtn.disabled = false;
            document.getElementById('saveAoiBtn').disabled = false;
            const sizeText = `${dim.width.toFixed(2)} km x ${dim.height.toFixed(2)} km`;
            statusText.innerText = `Area selected: ${sizeText}`;
            document.getElementById('aoiStatus').innerText = `Area selected: ${sizeText}`;
        };

        // Initial calculation
        updateSelectionData();

        // Listen for adjustments made via corner/edge handles
        layer.on('edit', updateSelectionData);
    });

    // Handle deletion of drawn rectangle
    map.on(L.Draw.Event.DELETED, function (event) {
        if (drawnItems.getLayers().length === 0) {
            currentBbox = null;
            scanBtn.disabled = true;
            document.getElementById('saveAoiBtn').disabled = true;
            statusText.innerText = "Draw a rectangle to begin.";
            document.getElementById('aoiStatus').innerText = "Draw a rectangle to begin.";
        }
    });

    // Helper to add imagery to the map and tracking list
    function addImageryLayer(imageUrl, bounds, datetime, folderName, serverCustomName) {
        const dateObj = new Date(datetime);
        const zuluTime = dateObj.toISOString().replace('T', ' ').replace(/\..+/, '') + ' Z';
        const localTime = dateObj.toLocaleString();

        // Load saved name from localStorage if it exists
        const savedNames = JSON.parse(localStorage.getItem('layer_custom_names') || '{}');
        let captureName = serverCustomName || savedNames[folderName] || folderName;

        const getPopupContent = (name) => `
            <div style="min-width: 150px;">
                <strong>${name}</strong><hr style="margin: 5px 0;">
                <small><strong>Zulu:</strong> ${zuluTime}</small><br>
                <small><strong>Local:</strong> ${localTime}</small><br>
                <a href="${imageUrl}" target="_blank">Download PNG</a>
            </div>
        `;

        const sarLayer = L.imageOverlay(imageUrl, bounds, {
            opacity: 0.8,
            interactive: true
        })
        .addTo(map)
        .bindPopup(getPopupContent(captureName));
        
        const layerId = `layer-${Date.now()}-${Math.floor(Math.random()*1000)}`;
        const controlHtml = `
            <div id="${layerId}" class="layer-info">
                <div class="layer-info-header" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" checked onchange="toggleMapLayerVisibility('${layerId}')" title="Toggle Visibility">
                    <input type="text" class="name-input" value="${captureName}" placeholder="Layer Name" style="flex: 1; min-width: 0;">
                    <button class="remove-layer-btn" onclick="removeSpecificLayer('${folderName}', '${layerId}')" title="Remove Layer">&times;</button>
                </div>
                <details style="margin-top: 8px;">
                    <summary style="cursor: pointer; font-size: 0.85em; color: #007bff; outline: none;">Layer Controls & Info</summary>
                    <div style="margin-top: 8px; font-size: 0.85em;">
                        <div style="margin-bottom: 5px;">
                            <strong>Zulu:</strong> ${zuluTime}<br>
                            <strong>Local:</strong> ${localTime}
                        </div>
                        <div class="layer-controls">
                            <label>Opacity</label>
                            <input type="range" class="opacity-slider" min="0" max="1" step="0.01" value="1">
                            
                            <label style="margin-top: 10px; display: flex; justify-content: space-between;">
                                <span>CV Threshold</span>
                                <span class="threshold-val" style="font-weight: normal; color: #007bff;">40</span>
                            </label>
                            <input type="range" class="cv-threshold-slider" min="10" max="200" step="1" value="40" oninput="this.previousElementSibling.querySelector('.threshold-val').innerText = this.value" onchange="runCVDetection('${folderName}', '${layerId}')">
                            
                            <button class="btn run-cv-btn" style="margin-top: 10px; font-size: 0.8rem; padding: 6px; width: 100%;" onclick="runCVDetection('${folderName}', '${layerId}')">Run CV Detection</button>
                            
                            <div class="cv-toggle-container" style="display: none; margin-top: 10px; align-items: center; background: #f8f9fa; padding: 6px; border-radius: 4px; border: 1px solid #ddd;">
                                <label style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; width: 100%;">
                                    <input type="checkbox" class="cv-visibility-toggle" checked onchange="toggleCVLayer('${layerId}')">
                                    <span class="cv-results-text" style="font-size: 0.85em; font-weight: 500;">0 Ships</span>
                                </label>
                            </div>
                        </div>
                        <div style="margin-top: 5px; text-align: right;"><small><a href="${imageUrl}" target="_blank">View Original Image</a></small></div>
                    </div>
                </details>
            </div>
        `;
        document.getElementById('layersList').insertAdjacentHTML('afterbegin', controlHtml);
        
        const container = document.getElementById(layerId);
        container.querySelector('.opacity-slider').oninput = (e) => sarLayer.setOpacity(e.target.value);
        container.querySelector('.name-input').oninput = (e) => {
            const newName = e.target.value;
            sarLayer.setPopupContent(getPopupContent(newName || folderName));
            
            // Save the custom name to localStorage
            const names = JSON.parse(localStorage.getItem('layer_custom_names') || '{}');
            names[folderName] = e.target.value;
            localStorage.setItem('layer_custom_names', JSON.stringify(names));

            // Save the custom name to the server JSON
            updateServerMetadata(folderName, newName);
        };

        activeLayers.push({ leafletLayer: sarLayer, uiId: layerId, folder: folderName });
    }

    // Function to remove a single specific layer
    function removeSpecificLayer(folderName, uiId) {
        if (!confirm("Are you sure you want to remove this layer from the map?")) return;
        
        const layerObj = activeLayers.find(l => l.uiId === uiId);
        if (layerObj) {
            map.removeLayer(layerObj.leafletLayer);
            if (layerObj.detectLayer) map.removeLayer(layerObj.detectLayer);
            document.getElementById(uiId).remove();
            activeLayers = activeLayers.filter(l => l.uiId !== uiId);
            
            // Update localStorage
            let selected = JSON.parse(localStorage.getItem('selected_scans') || '[]');
            selected = selected.filter(f => f !== folderName);
            localStorage.setItem('selected_scans', JSON.stringify(selected));
        }
    }

    function toggleMapLayerVisibility(uiId) {
        const layerObj = activeLayers.find(l => l.uiId === uiId);
        if (!layerObj) return;

        const cb = document.querySelector(`#${uiId} > .layer-info-header input[type="checkbox"]`);
        if (cb && cb.checked) {
            map.addLayer(layerObj.leafletLayer);
        } else {
            map.removeLayer(layerObj.leafletLayer);
        }
    }

    // Clear All functionality
    document.getElementById('clearScansBtn').onclick = () => {
        if (!confirm("Are you sure you want to clear all scans?")) return;
        
        activeLayers.forEach(item => {
            map.removeLayer(item.leafletLayer);
            if (item.detectLayer) map.removeLayer(item.detectLayer);
            const uiEl = document.getElementById(item.uiId);
            if (uiEl) uiEl.remove();
        });
        activeLayers = [];
        localStorage.removeItem('selected_scans'); // Sync with gallery state
        statusText.innerText = "All layers cleared.";
    };

    function toggleCVLayer(uiId) {
        const layerObj = activeLayers.find(l => l.uiId === uiId);
        if (!layerObj || !layerObj.detectLayer) return;

        const cb = document.querySelector(`#${uiId} .cv-visibility-toggle`);
        if (cb && cb.checked) {
            map.addLayer(layerObj.detectLayer);
        } else {
            map.removeLayer(layerObj.detectLayer);
        }
    }

    async function runCVDetection(folderName, uiId) {
        const layerObj = activeLayers.find(l => l.uiId === uiId);
        if (!layerObj) return;

        const btn = document.querySelector(`#${uiId} .run-cv-btn`);
        const thresholdInput = document.querySelector(`#${uiId} .cv-threshold-slider`);
        const thresholdVal = thresholdInput ? thresholdInput.value : 40;
        const toggleContainer = document.querySelector(`#${uiId} .cv-toggle-container`);
        const toggleCb = document.querySelector(`#${uiId} .cv-visibility-toggle`);
        const resultsText = document.querySelector(`#${uiId} .cv-results-text`);

        btn.disabled = true;
        btn.innerText = "Running Detection...";

        try {
            const res = await fetch(`/api/run_cv/${folderName}`, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ threshold: thresholdVal })
            });
            const data = await res.json();

            if (data.status === 'success') {
                if (layerObj.detectLayer) map.removeLayer(layerObj.detectLayer);
                
                const detectLayer = L.featureGroup();
                layerObj.detectLayer = detectLayer;

                const bounds = layerObj.leafletLayer.getBounds();
                const minLat = bounds.getSouth();
                const maxLat = bounds.getNorth();
                const minLon = bounds.getWest();
                const maxLon = bounds.getEast();

                const latScale = (maxLat - minLat) / data.height;
                const lonScale = (maxLon - minLon) / data.width;

                data.boxes.forEach(box => {
                    const [x, y, w, h] = box;
                    // Convert pixel coordinates to geographic coordinates
                    const b_minLon = minLon + x * lonScale;
                    const b_maxLon = minLon + (x + w) * lonScale;
                    const b_maxLat = maxLat - y * latScale; // y=0 is top of image
                    const b_minLat = maxLat - (y + h) * latScale;

                    L.rectangle([[b_minLat, b_minLon], [b_maxLat, b_maxLon]], {
                        color: "#ff3333",
                        weight: 2,
                        fillOpacity: 0.1
                    }).addTo(detectLayer).bindPopup(`<b>Ship Detected</b><br>Pixels: ${w}x${h}`);
                });

                // Respect the checkbox state, default to checked
                if (!toggleCb || toggleCb.checked) {
                    detectLayer.addTo(map);
                }
                if (toggleContainer) {
                    toggleContainer.style.display = 'flex';
                    resultsText.innerText = `${data.boxes.length} Ships Detected`;
                }

                btn.disabled = false;
                btn.innerText = "Update Detection";
            } else {
                btn.innerText = "Error: " + data.error;
                btn.disabled = false;
            }
        } catch (err) {
            btn.innerText = "Connection Error";
            btn.disabled = false;
        }
    }

    scanBtn.onclick = async () => {
        if (!currentBbox) return;
        
        scanBtn.disabled = true;
        statusText.innerText = "Fetching SAR imagery...";

        try {
            const response = await fetch('/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bbox: currentBbox })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                addImageryLayer(result.imageUrl, result.bounds, result.datetime, result.folderName, null);
                statusText.innerText = "Scan complete!";
                
                // Remove the selection box to prevent accidental rescans
                drawnItems.clearLayers();
                currentBbox = null;
                document.getElementById('saveAoiBtn').disabled = true;
                document.getElementById('aoiStatus').innerText = "Draw a rectangle to begin.";
            } else {
                statusText.innerText = "Error: " + result.error;
                scanBtn.disabled = false;
            }
        } catch (e) {
            statusText.innerText = "Connection failed.";
            scanBtn.disabled = false;
        }
    };

    // Startup Logic: Load scans added from Gallery via localStorage
    window.addEventListener('load', async () => {
        const params = new URLSearchParams(window.location.search);
        const loadImmediate = params.get('load');
        let selected = JSON.parse(localStorage.getItem('selected_scans') || '[]');

        if (loadImmediate && !selected.includes(loadImmediate)) {
            selected.push(loadImmediate);
            localStorage.setItem('selected_scans', JSON.stringify(selected));
        }

        for (const folder of selected) {
            try {
                const res = await fetch(`/api/scan/${folder}`);
                const data = await res.json();
                if (!data.error) {
                    addImageryLayer(data.imageUrl, data.bounds, data.datetime, folder, data.custom_name);
                    // Auto-zoom to the area if this specific scan was requested via URL
                    if (folder === loadImmediate) {
                        map.fitBounds(data.bounds);
                    }
                }
            } catch (err) { console.error("Failed to load persistent scan", folder); }
        }
    });

    // --- AOI Functionality ---
    
    let aoiMapLayers = [];
    
    function toggleAoiLayer(uiId) {
        const layerObj = aoiMapLayers.find(l => l.uiId === uiId);
        if (!layerObj) return;

        const cb = document.querySelector(`#${uiId} > .layer-info-header input[type="checkbox"]`);
        if (cb && cb.checked) {
            map.addLayer(layerObj.leafletLayer);
        } else {
            map.removeLayer(layerObj.leafletLayer);
        }
    }

    // Function to load and display saved AOIs from the database
    async function loadAOIs() {
        try {
            const response = await fetch('/api/aoi');
            const aois = await response.json();
            const aoiList = document.getElementById('aoiList');
            
            if (aoiList) {
                aoiList.innerHTML = '';
                if (aois.length === 0) {
                    aoiList.innerHTML = '<div style="color: #666; font-size: 0.85em;">No AOIs saved yet.</div>';
                }
            }
            
            // Clear existing AOI map layers
            aoiMapLayers.forEach(item => {
                map.removeLayer(item.leafletLayer);
                const uiEl = document.getElementById(item.uiId);
                if (uiEl) uiEl.remove();
            });
            aoiMapLayers = [];

            aois.forEach(aoi => {
                if (aoiList) {
                    const div = document.createElement('div');
                    div.style.border = '1px solid #eee';
                    div.style.padding = '10px';
                    div.style.borderRadius = '5px';
                    div.style.backgroundColor = '#fdfdfd';
                    
                    // Format the next scan timestamp if it exists
                    let nextScanText = '<span style="color: #666; font-size: 0.8em;">Not predicted yet</span>';
                    if (aoi.next_scan) {
                        const scanDate = new Date(aoi.next_scan);
                        nextScanText = `<span style="background: #28a745; color: white; padding: 2px 6px; border-radius: 3px; font-size: 0.8em;" title="Next Scan: ${scanDate.toLocaleString()}">${scanDate.toLocaleString()}</span>`;
                    }

                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                            <strong>${aoi.name}</strong>
                            ${nextScanText}
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <small style="color: #666; font-size: 0.7em;">BBox: [${aoi.bbox.map(n => n.toFixed(2)).join(', ')}]</small>
                            <button class="btn" style="padding: 4px 8px; font-size: 0.8em;" onclick="predictAOI(${aoi.id})">Predict Scan</button>
                        </div>
                    `;
                    aoiList.appendChild(div);
                }

                // Add bounding box layer
                const bounds = [[aoi.bbox[1], aoi.bbox[0]], [aoi.bbox[3], aoi.bbox[2]]];
                const aoiRect = L.rectangle(bounds, { color: '#28a745', weight: 2, fillOpacity: 0.1 });
                const layerId = `aoi-layer-${aoi.id}`;
                
                const zuluTime = aoi.next_scan ? new Date(aoi.next_scan).toISOString().replace('T', ' ').replace(/\..+/, '') + ' Z' : 'Not predicted yet';
                
                const controlHtml = `
                    <div id="${layerId}" class="layer-info" style="border-left: 4px solid #28a745;">
                        <div class="layer-info-header" style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" checked onchange="toggleAoiLayer('${layerId}')" title="Toggle Visibility">
                            <strong style="flex: 1; font-size: 0.9em; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="AOI: ${aoi.name}">AOI: ${aoi.name}</strong>
                        </div>
                        <details style="margin-top: 8px;">
                            <summary style="cursor: pointer; font-size: 0.85em; color: #007bff; outline: none;">Layer Controls & Info</summary>
                            <div style="margin-top: 8px; font-size: 0.85em; color: #555;">
                                <strong>Next Scan:</strong> ${zuluTime}
                            </div>
                        </details>
                    </div>
                `;
                document.getElementById('layersList').insertAdjacentHTML('beforeend', controlHtml);
                aoiRect.addTo(map);
                aoiMapLayers.push({ leafletLayer: aoiRect, uiId: layerId, id: aoi.id });
            });
        } catch (error) {
            console.error("Error loading AOIs:", error);
        }
    }

    // Function to save the current map bounding box
    document.getElementById('saveAoiBtn').addEventListener('click', async () => {
        const nameInput = document.getElementById('aoiName');
        const name = nameInput.value.trim();
        
        if (!name) {
            alert("Please enter a name for the Area of Interest.");
            return;
        }

        if (!currentBbox) {
            alert("Please draw a rectangle on the map first.");
            return;
        }

        const bbox = currentBbox;

        try {
            const response = await fetch('/api/aoi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, bbox: bbox })
            });
            
            const result = await response.json();
            if (result.status === 'success') {
                nameInput.value = ''; // Clear the input field
                drawnItems.clearLayers();
                currentBbox = null;
                document.getElementById('saveAoiBtn').disabled = true;
                scanBtn.disabled = true;
                document.getElementById('aoiStatus').innerText = "Draw a rectangle to begin.";
                statusText.innerText = "Draw a rectangle to begin.";
                loadAOIs(); // Reload the list
            } else {
                alert('Error saving AOI: ' + (result.error || 'Unknown error'));
            }
        } catch (error) {
            console.error("Error saving AOI:", error);
            alert("Failed to save AOI.");
        }
    });

    // Function to trigger a scan prediction for a specific AOI
    async function predictAOI(aoiId) {
        try {
            const response = await fetch(`/api/aoi/${aoiId}/predict`, {
                method: 'POST'
            });
            const result = await response.json();
            
            if (response.ok && result.status === 'success') {
                loadAOIs(); // Reload the list to show the updated prediction timestamp
            } else {
                alert('Error predicting scan: ' + (result.error || 'No upcoming scans found'));
            }
        } catch (error) {
            console.error("Error predicting AOI:", error);
            alert("Failed to trigger prediction.");
        }
    }

    // Initial load
    loadAOIs();
</script>
{% endblock %}
