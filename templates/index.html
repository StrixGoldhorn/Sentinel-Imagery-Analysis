{% extends 'base.html' %}

{% block title %}SAR Maritime Scanner{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="/static/css/styles.css" />
{% endblock %}

{% block content %}
<div class="sidebar">
    <div class="accordion-item">
        <button class="accordion-header active" onclick="toggleAccordion(this)">Area Scan</button>
        <div id="scan-page" class="accordion-content active">
            <h3>SAR Area Scan</h3>
            <p id="status">Draw a rectangle to begin.</p>
            <button id="scanBtn" disabled>Scan Selected Area</button>
            <button id="clearScansBtn" style="background: #dc3545; margin-top: 5px;">Clear All Scans</button>
        </div>
    </div>

    <div class="accordion-item">
        <button class="accordion-header" onclick="toggleAccordion(this)">Layers</button>
        <div id="layers-page" class="accordion-content">
            <h3>Manage Layers</h3>
            <div id="layersList"></div>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
    // Load saved map view or defaults
    const savedView = JSON.parse(localStorage.getItem('map_view_state')) || {
        lat: 1.290270,
        lng: 103.851959,
        zoom: 10
    };
    const map = L.map('map').setView([savedView.lat, savedView.lng], savedView.zoom);

    const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Add dynamic scale bar (metric units)
    L.control.scale({ imperial: false }).addTo(map);

    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const baseMaps = { "Map View": osm };
    const overlayMaps = { "Selection Box": drawnItems };
    const layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

    const drawControl = new L.Control.Draw({
        draw: {
            polygon: false, marker: false, circle: false, polyline: false, circlemarker: false,
            rectangle: { shapeOptions: { color: '#007bff' } }
        },
        edit: { featureGroup: drawnItems }
    });
    map.addControl(drawControl);

    // Sidebar Accordion Logic
    function toggleAccordion(header) {
        const content = header.nextElementSibling;
        const isActive = header.classList.contains('active');
        
        // Close all other items
        document.querySelectorAll('.accordion-header').forEach(h => { if(h !== header) h.classList.remove('active') });
        document.querySelectorAll('.accordion-content').forEach(c => { if(c !== content) c.classList.remove('active') });
        
        // Toggle current item
        header.classList.toggle('active');
        content.classList.toggle('active');
    }

    let currentBbox = null;
    let activeLayers = []; // Track layers to allow "Clear All" functionality

    // Save map view whenever it changes
    map.on('moveend', () => {
        localStorage.setItem('map_view_state', JSON.stringify({
            lat: map.getCenter().lat,
            lng: map.getCenter().lng,
            zoom: map.getZoom()
        }));
    });

    const scanBtn = document.getElementById('scanBtn');
    const statusText = document.getElementById('status');

    // Function to calculate dimensions in km
    function getDimensions(layer) {
        const bounds = layer.getBounds();
        const nw = bounds.getNorthWest();
        const ne = bounds.getNorthEast();
        const sw = bounds.getSouthWest();
        
        // Calculate distance in meters and convert to km
        const width = map.distance(nw, ne) / 1000;
        const height = map.distance(nw, sw) / 1000;
        
        return { width, height };
    }

    // Enhanced dynamic dimension updates during mouse movement
    map.on(L.Draw.Event.DRAWSTART, function(e) {
        if (e.drawLayerType === 'rectangle') {
            const moveHandler = function() {
                // Access the internal rectangle handler to get the live shape
                const drawHandler = drawControl._toolbars.draw._modes.rectangle.handler;
                if (drawHandler && drawHandler._shape) {
                    const dim = getDimensions(drawHandler._shape);
                    statusText.innerText = `Selecting: ${dim.width.toFixed(2)} km x ${dim.height.toFixed(2)} km`;
                }
            };
            
            map.on('mousemove', moveHandler);
            
            // Clean up listener when drawing is finished or cancelled
            map.once(L.Draw.Event.DRAWSTOP, () => map.off('mousemove', moveHandler));
        }
    });

    map.on(L.Draw.Event.CREATED, function (event) {
        drawnItems.clearLayers();
        const layer = event.layer;
        drawnItems.addLayer(layer);
        
        // Enable handles for immediate adjustment (corner/edge dragging)
        if (layer.editing) layer.editing.enable();

        const updateSelectionData = () => {
            const bounds = layer.getBounds();
            const dim = getDimensions(layer);

            // Format for backend: [min_lon, min_lat, max_lon, max_lat]
            currentBbox = [
                bounds.getWest(), bounds.getSouth(), 
                bounds.getEast(), bounds.getNorth()
            ];
            scanBtn.disabled = false;
            statusText.innerText = `Area selected: ${dim.width.toFixed(2)} km x ${dim.height.toFixed(2)} km`;
        };

        // Initial calculation
        updateSelectionData();

        // Listen for adjustments made via corner/edge handles
        layer.on('edit', updateSelectionData);
    });

    // Helper to add imagery to the map and tracking list
    function addImageryLayer(imageUrl, bounds, datetime) {
        const dateObj = new Date(datetime);
        const zuluTime = dateObj.toISOString().replace('T', ' ').replace(/\..+/, '') + ' Z';
        const localTime = dateObj.toLocaleString();
        let captureName = `Capture ${zuluTime}`;

        const getPopupContent = (name) => `
            <div style="min-width: 150px;">
                <strong>${name}</strong><hr style="margin: 5px 0;">
                <small><strong>Zulu:</strong> ${zuluTime}</small><br>
                <small><strong>Local:</strong> ${localTime}</small><br>
                <a href="${imageUrl}" target="_blank">Download PNG</a>
            </div>
        `;

        const sarLayer = L.imageOverlay(imageUrl, bounds, {
            opacity: 0.8,
            interactive: true
        })
        .addTo(map)
        .bindPopup(getPopupContent(captureName));
        
        layerControl.addOverlay(sarLayer, `Imagery (${zuluTime})`);
        
        const layerId = `layer-${Date.now()}-${Math.floor(Math.random()*1000)}`;
        const controlHtml = `
            <div id="${layerId}" class="layer-info">
                <input type="text" class="name-input" value="${captureName}" placeholder="Capture Name">
                <div style="margin-bottom: 5px;">
                    <strong>Zulu:</strong> ${zuluTime}<br>
                    <strong>Local:</strong> ${localTime}
                </div>
                <label style="display: block; margin-top: 5px;">Opacity:</label>
                <input type="range" class="opacity-slider" min="0" max="1" step="0.1" value="0.8">
                <br><small><a href="${imageUrl}" target="_blank">View Image</a></small>
            </div>
        `;
        document.getElementById('layersList').insertAdjacentHTML('afterbegin', controlHtml);
        
        const container = document.getElementById(layerId);
        container.querySelector('.opacity-slider').oninput = (e) => sarLayer.setOpacity(e.target.value);
        container.querySelector('.name-input').oninput = (e) => {
            captureName = e.target.value || `Capture ${zuluTime}`;
            sarLayer.setPopupContent(getPopupContent(captureName));
        };

        activeLayers.push({ leafletLayer: sarLayer, uiId: layerId });
    }

    // Clear All functionality
    document.getElementById('clearScansBtn').onclick = () => {
        activeLayers.forEach(item => {
            map.removeLayer(item.leafletLayer);
            layerControl.removeLayer(item.leafletLayer);
        });
        activeLayers = [];
        document.getElementById('layersList').innerHTML = '';
        localStorage.removeItem('selected_scans'); // Sync with gallery state
        statusText.innerText = "All layers cleared.";
    };

    scanBtn.onclick = async () => {
        if (!currentBbox) return;
        
        scanBtn.disabled = true;
        statusText.innerText = "Fetching SAR imagery...";

        try {
            const response = await fetch('/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ bbox: currentBbox })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                addImageryLayer(result.imageUrl, result.bounds, result.datetime);
                statusText.innerText = "Scan complete!";
            } else {
                statusText.innerText = "Error: " + result.error;
            }
        } catch (e) {
            statusText.innerText = "Connection failed.";
        }
        scanBtn.disabled = false;
    };

    // Startup Logic: Load scans added from Gallery via localStorage
    window.addEventListener('load', async () => {
        const params = new URLSearchParams(window.location.search);
        const loadImmediate = params.get('load');
        let selected = JSON.parse(localStorage.getItem('selected_scans') || '[]');

        if (loadImmediate && !selected.includes(loadImmediate)) {
            selected.push(loadImmediate);
            localStorage.setItem('selected_scans', JSON.stringify(selected));
        }

        for (const folder of selected) {
            try {
                const res = await fetch(`/api/scan/${folder}`);
                const data = await res.json();
                if (!data.error) {
                    addImageryLayer(data.imageUrl, data.bounds, data.datetime);
                    // Auto-zoom to the area if this specific scan was requested via URL
                    if (folder === loadImmediate) {
                        map.fitBounds(data.bounds);
                    }
                }
            } catch (err) { console.error("Failed to load persistent scan", folder); }
        }
    });
</script>
{% endblock %}
