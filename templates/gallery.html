<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagery Gallery - Sentinel Analysis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">Sentinel maritime-SAR</a>
        <div class="nav-links">
            <a href="/">Scanner</a>
            <a href="/gallery">Gallery</a>
        </div>
    </nav>

    <div class="container gallery-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Imagery Gallery</h1>
        </div>

        {% if not scans %}
            <div class="alert alert-info">No imagery has been saved yet. Go perform a scan!</div>
        {% endif %}

        {% for scan in scans %}
            <div class="scan-group">
                <h3 class="text-muted small">Scan ID: {{ scan.folder }}</h3>
                <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                    {% for img_url in scan.images %}
                    <div class="col">
                        <div class="card h-100 img-card shadow-sm">
                            <a href="{{ img_url }}" target="_blank">
                                <img src="{{ img_url }}" class="card-img-top img-thumbnail" alt="SAR Image">
                            </a>
                            <div class="card-body py-2">
                                <p class="card-text text-truncate small">{{ img_url.split('/')[-1] }}</p>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        {% endfor %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
